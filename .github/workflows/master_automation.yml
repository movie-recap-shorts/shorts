name: Master Shorts Automation

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: shorts-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  process-shorts:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit upload_log.json and topic_history.json back to repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip install playwright
        playwright install chromium

    - name: Detect Channel & Setup Environment
      id: setup
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
      run: |
        if [ "${{ github.repository }}" == "statsmeans-source/shorts" ]; then
          echo "channel=motivation_en" >> $GITHUB_OUTPUT
          export CHANNEL_NAME=motivation_en
        elif [ "${{ github.repository }}" == "movie-recap-shorts/shorts" ]; then
          echo "channel=movies_en" >> $GITHUB_OUTPUT
          export CHANNEL_NAME=movies_en
        else
          echo "Error: Unknown repository ${{ github.repository }}"
          exit 1
        fi
        python scripts/github_env_setup.py

    - name: Create Credential Files
      env:
        IG_CRED_JSON: ${{ secrets.IG_CRED_JSON }}
        TIKTOK_COOKIES_TXT: ${{ secrets.TIKTOK_COOKIES_TXT }}
      run: |
        mkdir -p credentials
        if [ -n "$IG_CRED_JSON" ]; then
          echo "$IG_CRED_JSON" > credentials/motivation_en_ig_cred.json
          echo "Created Instagram credentials file"
        fi
        if [ -n "$TIKTOK_COOKIES_TXT" ]; then
          echo "$TIKTOK_COOKIES_TXT" > credentials/motivation_en_tiktok_cookies.txt
          echo "Created TikTok cookies file"
        fi

    - name: Run Automation (with Catch-up)
      env:
        PYTHONUNBUFFERED: "1"
      run: |
        python automation.py --once --channel ${{ steps.setup.outputs.channel }} --video-mode meme --catchup

    - name: Save Rate Limit & Topic History
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git pull --rebase origin main || true
        git add config/upload_log.json config/topic_history.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "chore: update upload log and topic history [skip ci]"
        git push origin main || true
